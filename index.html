<!DOCTYPE html>
<html lang="pl">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mój superbohater</title>
  </head>

  <body>
    <h1>Witaj na mojej stronie o Czekoladzie</h1>
    <h2>Jest okazja wygrać maskotkę </h2>
    <h3>jest to maskotka czekolady</h3>
    
    <!-- Akapit tekstu - domyślnie wyświetla się od nowej linii -->
    <p>To jest pierwszy akapit tekstu.</p>
    <p>To jest drugi akapit tekstu.</p>

    <!-- Formatowanie tekstu -->
    <b>pogrubienie</b>
    <i>kursywa (pochylenie)</i>
    <u>podkreślenie</u>
    <s>przekreślenie</s>

    <!-- Inne przydatne znaczniki -->
    <br>             <!-- wymusza nową linię (nie wymaga zamknięcia!) -->
    <hr>             <!-- pozioma linia - divider, separator sekcji -->
    <div>blok</div>  <!-- kontener grupujący elementy - sam nic nie wyświetla -->

  </body>

</html>
